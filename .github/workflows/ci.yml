name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: investor_test
          POSTGRES_USER: investor
          POSTGRES_PASSWORD: investor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U investor -d investor_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Ontoloji testleri gerçek PostgreSQL ister: EXCLUDE kısıtları, tstzrange
      # operatörleri ve plpgsql fonksiyonları gömülü bir veritabanında yok.
      - name: Build ve testler
        run: |
          ./gradlew build --no-daemon \
            -Dinvestor.test.db.url=jdbc:postgresql://localhost:5432/investor_test \
            -Dinvestor.test.db.username=investor \
            -Dinvestor.test.db.password=investor

      - name: Test raporlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/*/build/reports/tests/test
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
