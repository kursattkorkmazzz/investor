spring:
  application:
    name: investor

  datasource:
    url: ${INVESTOR_DB_URL:jdbc:postgresql://localhost:5432/investor}
    username: ${INVESTOR_DB_USERNAME:investor}
    password: ${INVESTOR_DB_PASSWORD:investor}
    hikari:
      maximum-pool-size: 10
      pool-name: investor-pool

  flyway:
    enabled: true
    # Her modül kendi migration klasörünü taşır; uygulama hepsini birleştirir.
    # Sürüm aralıkları modül başına bloklanır: ontoloji 1–99, market-data 100–199,
    # knowledge 200–299, decision-engine 300–399, llm 400–499. Tek global sıra, çakışma yok.
    locations:
      - classpath:db/migration/ontology
      - classpath:db/migration/marketdata
      - classpath:db/migration/knowledge
      - classpath:db/migration/llm

  # Sanal iş parçacıkları: analiz ajanları ileride paralel koşacak, engelleyen
  # G/Ç başına platform thread'i harcamanın anlamı yok.
  threads:
    virtual:
      enabled: true

investor:
  market-data:
    # Zamanlanmış toplama üretimde açılır; yerelde ve testte kapalı kalsın ki
    # beklenmedik dış istek yapılmasın.
    scheduling-enabled: ${INVESTOR_MARKET_DATA_ENABLED:false}
    base-url: ${INVESTOR_BINANCE_URL:https://api.binance.com}
    symbols: ${INVESTOR_SYMBOLS:BTCUSDT,ETHUSDT}
    staleness-tolerance: PT5M
    weight-budget: 800
    partitions-ahead: 3

  knowledge:
    scheduling-enabled: ${INVESTOR_KNOWLEDGE_ENABLED:false}
    # İki başlığın aynı olayı anlattığını kabul etmek için gereken benzerlik.
    # Küçük ve yapay bir örneklemde kalibre edildi; gerçek besleme verisiyle
    # yeniden ölçülmeli (bkz. docs/04-veri-katmani.md).
    similarity-threshold: 0.45
    cluster-window: PT72H
    macro-series: ${INVESTOR_MACRO_SERIES:}
    fred-api-key: ${INVESTOR_FRED_API_KEY:}
    entity-keywords:
      bitcoin: "ASSET:BTC"
      btc: "ASSET:BTC"
      ethereum: "ASSET:ETH"
      eth: "ASSET:ETH"

  llm:
    # Kapatıldığında sistem kural tabanlı çıkarıcılarla çalışmaya devam eder.
    enabled: ${INVESTOR_LLM_ENABLED:true}
    # Varsayılan: LangChain4j'in demo ucu — anahtar almadan denemek için. Hız sınırlı ve
    # garantisiz; üretimde kendi anahtarınızla ezin.
    base-url: ${INVESTOR_LLM_BASE_URL:http://langchain4j.dev/demo/openai/v1}
    # ASLA buraya yazılmaz; ortam değişkeninden, üretimde Secrets Manager'dan gelir.
    api-key: ${INVESTOR_LLM_API_KEY:demo}
    model: ${INVESTOR_LLM_MODEL:gpt-4o-mini}
    # Demo ucunun katı JSON şemasını desteklediğine dair güvence yok; kendi anahtarınıza
    # geçtiğinizde açın — şema zorlaması istem enjeksiyonuna karşı asıl savunma katmanı.
    strict-schema: ${INVESTOR_LLM_STRICT_SCHEMA:false}
    timeout: PT60S
    max-retries: 2
    # Tavan aşılınca çağrılar reddedilir. Kaçak bir döngü gerçek para harcar; bu bir
    # güvenlik sınırı, muhasebe kolaylığı değil.
    monthly-budget-usd: ${INVESTOR_LLM_BUDGET_USD:50}
    pricing:
      # gpt-4o-mini, milyon token başına USD. Model değişirse burası da değişmeli.
      input-per-million: 0.15
      cached-input-per-million: 0.075
      output-per-million: 0.60

server:
  port: ${INVESTOR_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.investor: INFO
    org.flywaydb: INFO
