# Yerel geliştirme bağımlılıkları.
#
# Üretimde veritabanı AWS RDS'te (ADR-0003); bu dosya yalnızca geliştirme ve CI içindir.
# Uygulamanın kendisi buradan çalıştırılmaz — IDE'den veya ./gradlew bootRun ile koşar.
services:
  postgres:
    image: postgres:16-alpine
    container_name: investor-postgres
    environment:
      POSTGRES_DB: investor
      POSTGRES_USER: investor
      POSTGRES_PASSWORD: investor
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investor -d investor"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: valkey/valkey:8-alpine
    container_name: investor-redis
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
